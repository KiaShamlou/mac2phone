name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-and-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Check, test, and build without signing
        run: Scripts/check.sh
      - name: Synthetic paired transport integration
        run: Scripts/check-cross-platform.sh
