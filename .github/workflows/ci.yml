name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-and-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install JavaScript test dependencies without downloading Electron
        run: npm --prefix desktop ci --ignore-scripts
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Check, test, and build without signing
        run: Scripts/check.sh
      - name: Synthetic paired transport integration
        run: Scripts/check-cross-platform.sh
